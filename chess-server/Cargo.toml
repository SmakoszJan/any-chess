[package]
name = "chess-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
futures = "0.3.32"
jsonwebtoken = "10.3.0"
rand = "0.10.0"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = "1.50.0"
tracing = "0.1.44"
uuid = "1.23.0"
